# Builds and tests the atlas-updater helper (tools/atlas-updater) on Windows, macOS and Linux.
# Each build is kept as an artifact, so it can be downloaded from the run page.
name: Updater

on:
  push:
    paths:
      - "tools/atlas-updater/**"
      - ".github/workflows/updater.yml"
  pull_request:
    paths:
      - "tools/atlas-updater/**"
      - ".github/workflows/updater.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: atlas-updater
            artifact: atlas-updater-linux
          - os: macos-latest
            binary: atlas-updater
            artifact: atlas-updater-macos
          - os: windows-latest
            binary: atlas-updater.exe
            artifact: atlas-updater-windows
          - os: macos-15-intel
            binary: atlas-updater
            artifact: atlas-updater-macos-intel
          # The arm64 runners are free in public repositories. This build checks that the helper compiles and passes its
          # tests on Linux arm64. The release does not ship it yet: the offline engine has no arm64 build (see the README).
          # Windows arm64 is not here: tract-linalg (the OCR runtime) does not link its arm64 kernels with the MSVC
          # toolchain on the windows-11-arm runner. Add it back once that build works.
          - os: ubuntu-24.04-arm
            binary: atlas-updater
            artifact: atlas-updater-linux-arm64
    defaults:
      run:
        shell: bash
        working-directory: tools/atlas-updater
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (the helper window needs Rust 1.92 or later)
        uses: dtolnay/rust-toolchain@stable

      - name: Compile errors as annotations (so a failed build shows what broke)
        shell: bash
        working-directory: tools/atlas-updater
        run: |
          cargo test --release --no-run --message-format=json > "$RUNNER_TEMP/cargo-messages.json" 2>/dev/null || true
          python3 - "$RUNNER_TEMP/cargo-messages.json" <<'PY'
          import json, sys
          for line in open(sys.argv[1], encoding="utf-8", errors="replace"):
              try:
                  m = json.loads(line)
              except ValueError:
                  continue
              if m.get("reason") != "compiler-message":
                  continue
              msg = m["message"]
              if msg["level"] != "error":
                  continue
              spans = [x for x in msg.get("spans", []) if x.get("is_primary")] or msg.get("spans", [])
              where = ""
              if spans:
                  where = "file=%s,line=%s" % (spans[0]["file_name"], spans[0]["line_start"])
              text = (msg.get("rendered") or msg["message"]).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error %s::%s" % (where, text))
          PY

      - name: Unit tests
        id: tests
        # ATLAS_OCR_TEST downloads the text models from PyPI and reads a sample page with them.
        env:
          ATLAS_OCR_TEST: "1"
        run: cargo test --release 2>&1 | tee "$RUNNER_TEMP/updater-test.log"

      - name: Show the failing tests (as annotations, so a failure shows its cause)
        if: failure() && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/updater-test.log" <<'PY'
          import sys
          lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          hits = [i for i, l in enumerate(lines) if "panicked" in l or "FAILED" in l or "test result" in l]
          # A build script or linker failure says "failed" or "error" in lower case, so those lines are shown too.
          if not hits:
              hits = [i for i, l in enumerate(lines) if "error" in l.lower() or "failed" in l.lower()]
          for i in hits[:8]:
              text = " | ".join(x.strip() for x in lines[i:i + 4]).replace("%", "%25")
              print("::error::" + text)
          if not hits:
              # Nothing matched: show the end of the log, so the cause is visible.
              tail = " | ".join(x.strip() for x in lines[-12:]).replace("%", "%25")
              print("::error::" + tail)
          PY

      - name: Offline translation with no network (Linux)
        if: runner.os == 'Linux'
        working-directory: tools/atlas-updater
        run: |
          # The test runs in a network namespace that has no interface, so a translation from saved packs must not
          # need the internet. The build is already done above, so the run uses --offline.
          set -o pipefail
          status=0
          sudo -E env PATH="$PATH" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            unshare -n "$(command -v cargo)" test --release --offline without_a_network 2>&1 | tee "$RUNNER_TEMP/offline-test.log" || status=$?
          # The run as root must not leave files that the next steps (as the runner user) cannot write.
          sudo chown -R "$(id -u):$(id -g)" target "${CARGO_HOME:-$HOME/.cargo}" || true
          # cargo exits 0 when a filter matches nothing, so the step also needs the test to have run.
          if [ "$status" -eq 0 ] && ! grep -q "1 passed" "$RUNNER_TEMP/offline-test.log"; then
            echo "The no-network test did not run."
            status=1
          fi
          exit $status

      - name: Build
        id: build
        run: cargo build --release

      - name: The Windows program carries its version information
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: tools/atlas-updater
        run: |
          $info = (Get-Item "target/release/atlas-updater.exe").VersionInfo
          if ($info.CompanyName -ne "Atlas Translation" -or $info.ProductName -ne "Atlas Translation Helper" -or $info.FileVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "the version information is missing from atlas-updater.exe"
          }

      - name: Refuses a folder that is not Atlas Translation (no network needed)
        id: refuse
        run: |
          folder="$RUNNER_TEMP/not-atlas"
          mkdir -p "$folder"
          echo '{"name": "Something else", "version": "1.0"}' > "$folder/manifest.json"
          set +e
          output=$("./target/release/${{ matrix.binary }}" "$folder" 2>&1)
          code=$?
          set -e
          echo "$output"
          test "$code" -eq 1
          echo "$output" | grep -q "is not the Atlas Translation folder"

      - name: Installs the latest release into a test folder (uses GitHub, checksum and unzip)
        id: install
        env:
          GH_TOKEN: ${{ github.token }}
          # The helper reads this to ask GitHub for the release without the shared-IP rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          log="${{ runner.temp }}/install-output.txt"
          : > "$log"
          exec > >(tee -a "$log") 2>&1
          # Nothing to install until a release is published. Skip the test then, and say so in the log.
          published=$(gh api "repos/${{ github.repository }}/releases?per_page=10" --jq '[.[] | select(.draft | not)] | length')
          if [ "$published" = "0" ]; then
            echo "No published release yet, so there is nothing to install. The install test is skipped."
            exit 0
          fi
          folder="${{ runner.temp }}/atlas-install-test"
          rm -rf "$folder"
          mkdir -p "$folder"
          echo '{"name": "Atlas Translation", "version": "0.0.1.0"}' > "$folder/manifest.json"
          echo "== first run"
          "./target/release/${{ matrix.binary }}" "$folder"
          echo "== installed files"
          ls -la "$folder" | head -40
          grep -q '"name": "Atlas Translation"' "$folder/manifest.json"
          if grep -q '"version": "0.0.1.0"' "$folder/manifest.json"; then
            echo "manifest.json was not replaced"
            exit 1
          fi
          test -f "$folder/service_worker.js"
          echo "== second run"
          second=$("./target/release/${{ matrix.binary }}" "$folder" 2>&1)
          echo "$second"
          echo "$second" | grep -q "You have the latest version"

      - name: Keep the install output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-output-${{ matrix.artifact }}
          path: ${{ runner.temp }}/install-output.txt
          if-no-files-found: warn

      - name: Windows installer (Inno Setup, for the current user only)
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: pwsh
        working-directory: tools/atlas-updater
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup was not installed" }
          # Cargo.toml writes the version as 0.0.2+7 (the part after + is the last number); the installer shows 0.0.2.7.
          $line = Select-String -Path Cargo.toml -Pattern '^version = "([0-9.]+)\+([0-9]+)"' | Select-Object -First 1
          $version = "$($line.Matches[0].Groups[1].Value).$($line.Matches[0].Groups[2].Value)"
          # Packaging test only: placeholder engine files, so the installer's engine lines are built and installed.
          # release.yml passes the real engine (built by engine.yml). These placeholders are never published.
          $engineDir = Join-Path $env:RUNNER_TEMP "engine-placeholder"
          New-Item -ItemType Directory -Force -Path $engineDir | Out-Null
          Set-Content -Path (Join-Path $engineDir "atlas-engine-windows.exe") -Value "placeholder"
          Set-Content -Path (Join-Path $engineDir "atlas-engine-lib-windows.dll") -Value "placeholder"
          & $iscc "/DMyAppVersion=$version" "/DEngineExe=$engineDir\atlas-engine-windows.exe" "/DEngineLib=$engineDir\atlas-engine-lib-windows.dll" installer\atlas-helper.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }
          if (-not (Test-Path "dist\atlas-updater-windows-setup.exe")) { throw "the installer file is missing" }

      - name: The installer installs, then uninstalls, silently
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: pwsh
        working-directory: tools/atlas-updater
        run: |
          $target = Join-Path $env:RUNNER_TEMP "atlas-helper-install-test"
          Remove-Item -Recurse -Force $target -ErrorAction SilentlyContinue
          $setup = (Resolve-Path "dist\atlas-updater-windows-setup.exe").Path
          $install = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$target`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "the installer exited with $($install.ExitCode)" }
          $exe = Join-Path $target "atlas-updater.exe"
          if (-not (Test-Path $exe)) { throw "the installer did not put atlas-updater.exe in $target" }
          if (-not (Test-Path (Join-Path $target "atlas-engine.exe"))) { throw "the installer did not put the offline engine in $target" }
          if (-not (Test-Path (Join-Path $target "atlas_engine.dll"))) { throw "the installer did not put the engine library in $target" }
          $uninstaller = Get-ChildItem $target -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw "no uninstaller was written" }
          $un = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($un.ExitCode -ne 0) { throw "the uninstaller exited with $($un.ExitCode)" }
          if (Test-Path $exe) { throw "the uninstaller left atlas-updater.exe behind" }
          if (Test-Path (Join-Path $target "atlas-engine.exe")) { throw "the uninstaller left the offline engine behind" }
          Write-Output "The installer installed and removed the helper in a silent run."

      - name: Upload the installer
        if: runner.os == 'Windows' && runner.arch == 'X64'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-updater-windows-setup
          path: tools/atlas-updater/dist/atlas-updater-windows-setup.exe
          if-no-files-found: error

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: tools/atlas-updater/target/release/${{ matrix.binary }}
          if-no-files-found: error

      # Runs even when a step failed. Shows each step's result, the unit test failures and the install output when they
      # failed, and the size and SHA-256 of the built helper when it was built. A summary problem never fails the job.
      - name: Job summary
        if: always()
        continue-on-error: true
        env:
          ASSET: ${{ matrix.artifact }}
        run: |
          summary="$GITHUB_STEP_SUMMARY"
          {
            echo "## Updater helper: ${{ matrix.os }}"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Unit tests | ${{ steps.tests.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| Refuses a folder that is not Atlas Translation | ${{ steps.refuse.outcome }} |"
            echo "| Installs the latest release | ${{ steps.install.outcome }} |"
            echo ""
          } >> "$summary"

          if [ "${{ steps.tests.outcome }}" = "failure" ] && [ -f "$RUNNER_TEMP/updater-test.log" ]; then
            {
              echo "### Unit test failures"
              echo ""
              echo "Lines that name a failed test or a panic (the first 60). The full log is in the Unit tests step."
              echo ""
              echo '```'
              grep -E "panicked|FAILED|failed|error" "$RUNNER_TEMP/updater-test.log" | head -n 60 || true
              echo '```'
              echo ""
            } >> "$summary"
          fi

          if [ "${{ steps.install.outcome }}" = "failure" ] && [ -f "$RUNNER_TEMP/install-output.txt" ]; then
            {
              echo "### Install output (last 40 lines)"
              echo ""
              echo '```'
              tail -n 40 "$RUNNER_TEMP/install-output.txt"
              echo '```'
              echo ""
            } >> "$summary"
          fi

          if [ "${{ steps.build.outcome }}" = "success" ]; then
            file="$GITHUB_WORKSPACE/tools/atlas-updater/target/release/${{ matrix.binary }}"
            if [ -f "$file" ]; then
              size=$(wc -c < "$file")
              digest=$(node -e "const c=require('crypto'),f=require('fs');process.stdout.write(c.createHash('sha256').update(f.readFileSync(process.argv[1])).digest('hex'))" "$file")
              {
                echo "### Helper: $ASSET"
                echo ""
                echo "- Size: $size bytes"
                echo "- SHA-256: \`$digest\`"
                echo ""
              } >> "$summary"
            fi
          fi
