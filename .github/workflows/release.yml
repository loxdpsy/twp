name: Release

# Build, test, or publish Atlas Translation.
#
# Run by hand (Actions > Release > Run workflow):
#   - version:  the version to build, for example 9.8.2.0 (no "v")
#   - action:   "build-and-test"    builds both packages and shows checksums in the summary. Nothing is published.
#               "build-and-release" also commits the version bump, creates the tag v<version>, and publishes a GitHub release.
#   - prerelease: mark the GitHub release as a prerelease. It is on until the launch. The helper (atlas-updater) installs
#     prereleases while INCLUDE_PRERELEASES is true in tools/atlas-updater/src/main.rs. Set both to a full release at launch.
#   - submit_amo: with build-and-release, send the Firefox store version to
#     addons.mozilla.org for review. The store step waits for AMO_LISTING_READY to be "true" (a repository variable or a secret of that name).
#
# Pushing a tag does NOT start this workflow any more. A tag push used to publish the release and submit it to the stores,
# so moving or pushing a tag could publish by accident. Only the manual run above publishes.
# The release notes come from the matching "## <version>" section in CHANGELOG.md.
# If the version is already published (its tag and GitHub release both exist), the run reports it and publishes nothing again. It does not fail.
# To publish a version again, delete its GitHub release. If the tag stays, the run publishes the release on the same tag and commit.
# To start over completely, delete the release and the tag, then run again. The version commit is made only when it is missing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 9.8.2.0 (no v)"
        type: string
        required: true
      action:
        description: "What to do"
        type: choice
        options:
          - build-and-test
          - build-and-release
        default: build-and-test
      prerelease:
        description: "Mark the GitHub release as a prerelease (build-and-release only). Turn it off at the launch."
        type: boolean
        default: true
      submit_amo:
        description: "Firefox store: send the store version to addons.mozilla.org for review (build-and-release only). The GitHub build is never sent to Mozilla."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      publish: ${{ steps.plan.outputs.publish }}
      submit: ${{ steps.plan.outputs.submit }}
      already: ${{ steps.plan.outputs.already }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # check.mjs runs cargo check when CI is set, and it needs the same Rust toolchain as the Checks workflow.
      - name: Set up Rust (the helper window needs Rust 1.92 or later)
        uses: dtolnay/rust-toolchain@stable

      - name: Work out what to do
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_ACTION: ${{ github.event.inputs.action }}
          INPUT_SUBMIT: ${{ github.event.inputs.submit_amo }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            VERSION="${REF_NAME#v}"
            PUBLISH=true
            SUBMIT=true
            # Prereleases until the launch. Set this to false then, and set INCLUDE_PRERELEASES to false in the helper.
            PRERELEASE=true
          else
            VERSION="$(echo "$INPUT_VERSION" | tr -d '[:space:]' | sed 's/^v//')"
            PUBLISH=$([ "$INPUT_ACTION" = "build-and-release" ] && echo true || echo false)
            SUBMIT=$([ "$PUBLISH" = "true" ] && [ "$INPUT_SUBMIT" = "true" ] && echo true || echo false)
            PRERELEASE=$([ "$INPUT_PRERELEASE" = "false" ] && echo false || echo true)
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,3}$'; then
            echo "::error::Version '$VERSION' is not valid. Use 1 to 4 numbers separated by dots, for example 9.8.2.0."
            exit 1
          fi
          ALREADY=false
          RESUME=false
          if [ "$PUBLISH" = "true" ] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              # Already published: the tag and the GitHub release both exist. This counts as done.
              # Nothing is committed, tagged, or published again, and the run does not fail.
              echo "Atlas Translation $VERSION is already published (release v$VERSION exists). Nothing is published again."
              ALREADY=true
              PUBLISH=false
              SUBMIT=false
            else
              # The tag exists but its GitHub release was deleted, for example to publish the version again. The tag and its
              # commit stay as they are: nothing is committed or tagged again, and the release is made on the existing tag.
              echo "The release v$VERSION was deleted but its tag exists. Publishing it again on the tag."
              RESUME=true
            fi
          fi

          if [ "$EVENT" = "push" ]; then
            # The tag must match the manifest that is already in the repository.
            CURRENT=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
            if [ "$CURRENT" != "$VERSION" ]; then
              echo "::error::Tag v$VERSION does not match manifest.json ($CURRENT)."
              exit 1
            fi
            SHA="$GITHUB_SHA"
          elif [ "$RESUME" = "true" ]; then
            SHA="$(git rev-parse "v$VERSION^{commit}")"
          elif [ "$PUBLISH" = "true" ]; then
            node scripts/sync-version.mjs "$VERSION"
            # Stop before anything is committed, tagged, or pushed. A missing CHANGELOG.md section, or a failing check or unit test, must not leave a version commit and tag on main.
            node scripts/check.mjs
            node tests/run.mjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Every file that sync-version.mjs changes. Staging only the manifests left package.json and the README badge behind.
            git add manifest.json firefox_manifest.json package.json package-lock.json README.md tools/atlas-updater/Cargo.toml
            if git diff --cached --quiet; then
              echo "manifest.json already has version $VERSION."
            else
              git commit -m "Release $VERSION"
            fi
            git tag "v$VERSION"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            git push origin "v$VERSION"
            SHA="$(git rev-parse HEAD)"
          else
            # Test build: nothing is committed or tagged. The builds stamp the version themselves.
            SHA="$GITHUB_SHA"
          fi

          {
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "publish=$PUBLISH"
            echo "submit=$SUBMIT"
            echo "already=$ALREADY"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always()
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PUBLISH: ${{ steps.plan.outputs.publish }}
          SUBMIT: ${{ steps.plan.outputs.submit }}
          ALREADY: ${{ steps.plan.outputs.already }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          {
            echo "## Release plan: Atlas Translation ${VERSION:-?}"
            echo ""
            echo "- Result: **${{ job.status }}**"
            echo "- Mode: $([ "$PUBLISH" = "true" ] && echo "**publish** (tag v$VERSION and a GitHub release)" || echo "**build and test only** (nothing published)")"
            if [ "$PUBLISH" = "true" ]; then echo "- Release type: $([ "$PRERELEASE" = "true" ] && echo "**prerelease**" || echo "**release**")"; fi
            echo "- Submit to addons.mozilla.org: ${SUBMIT:-false}"
            if [ "$ALREADY" = "true" ]; then
              echo "- Already published: release v$VERSION already exists, so nothing was published again. This run is treated as done."
            fi
            echo ""
            echo "The Chromium and Firefox builds below use version $VERSION."
          } >> "$GITHUB_STEP_SUMMARY"

  chromium:
    name: Chromium
    needs: prepare
    uses: ./.github/workflows/chromium.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

  firefox:
    name: Firefox (GitHub)
    needs: prepare
    uses: ./.github/workflows/firefox.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
      channel: unlisted
      submit: ${{ needs.prepare.outputs.submit == 'true' }}
    secrets: inherit

  # The Firefox store version. It is not attached to the GitHub release. It is sent to addons.mozilla.org for review
  # when submit is on, and it runs independently, so a store problem does not hold up the GitHub release.
  firefox-store:
    name: Firefox (store)
    needs: prepare
    uses: ./.github/workflows/firefox.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
      channel: listed
      submit: ${{ needs.prepare.outputs.submit == 'true' }}
    secrets: inherit

  edge:
    name: Edge Add-ons
    needs: [prepare, chromium]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'true' && needs.chromium.result == 'success' }}
    uses: ./.github/workflows/edge.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

  # The offline translation engine (tools/atlas-engine), built for Windows, macOS and Linux. The helper installs it
  # from the release. engine.yml also tests each program with a real language pack. A build failure stops the publish job.
  engine:
    name: Offline engine
    needs: prepare
    if: ${{ needs.prepare.result == 'success' }}
    uses: ./.github/workflows/engine.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  # The atlas-updater helper, built for Windows, macOS and Linux. Every release carries all three programs,
  # so the helper is always the version that matches the release. A build failure stops the publish job.
  helper:
    name: Helper (${{ matrix.os }})
    needs: [prepare, engine]
    if: ${{ needs.prepare.result == 'success' && needs.engine.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: atlas-updater-linux.AppImage
            engine: linux
          # Apple Silicon (the macos-latest runner is arm64). Its engine is the x86_64 one from engine.yml, which runs
          # here under Rosetta 2, as before. The Intel build below runs it natively.
          - os: macos-latest
            asset: atlas-updater-macos.dmg
            engine: macos
          - os: macos-15-intel
            asset: atlas-updater-macos-intel.dmg
            engine: macos
          - os: windows-latest
            asset: atlas-updater-windows.exe
            engine: windows
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust (the helper window needs Rust 1.92 or later)
        uses: dtolnay/rust-toolchain@stable

      - name: Build the helper (runs the Rust tests first)
        run: node scripts/build-helper.mjs --out "$RUNNER_TEMP/helper"

      # Linux and macOS: the package carries the offline engine and its library, so the helper finds them beside itself.
      - name: Download the offline engine (Linux and macOS packages)
        if: runner.os != 'Windows'
        uses: actions/download-artifact@v4
        with:
          pattern: atlas-engine-*${{ matrix.engine }}*
          merge-multiple: true
          path: ${{ runner.temp }}/engine

      - name: Linux AppImage (the helper, the offline engine and its library in one file)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/AppDir"
          rm -rf "$APP" && mkdir -p "$APP/usr/bin"
          cp "$RUNNER_TEMP/helper/atlas-updater-linux" "$APP/usr/bin/atlas-updater"
          cp "$RUNNER_TEMP/engine/atlas-engine-linux" "$APP/usr/bin/atlas-engine"
          cp "$RUNNER_TEMP/engine/atlas-engine-lib-linux.so" "$APP/usr/bin/libatlas_engine.so"
          chmod +x "$APP/usr/bin/atlas-updater" "$APP/usr/bin/atlas-engine"
          cp icons/icon-128.png "$APP/atlas-helper.png"
          # The licence texts and notices, as the packages must carry them.
          mkdir -p "$APP/usr/share/doc/atlas-helper"
          cp LICENSE NOTICE.md "$APP/usr/share/doc/atlas-helper/"
          cp -r LICENSES "$APP/usr/share/doc/atlas-helper/"
          cat > "$APP/atlas-helper.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Atlas Helper
          Comment=Offline translation for Atlas Translation
          Exec=AppRun
          Icon=atlas-helper
          Terminal=false
          Categories=Utility;
          DESKTOP
          cat > "$APP/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/atlas-updater" "$@"
          APPRUN
          chmod +x "$APP/AppRun"
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$RUNNER_TEMP/appimagetool" "$APP" "$RUNNER_TEMP/helper/atlas-updater-linux.AppImage"
          ls -l "$RUNNER_TEMP/helper/atlas-updater-linux.AppImage"

      - name: macOS disk image (the helper, the offline engine and its library in one app)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmg"
          APP="$STAGE/Atlas Helper.app"
          rm -rf "$STAGE" && mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$RUNNER_TEMP/helper/atlas-updater-macos" "$APP/Contents/MacOS/atlas-updater"
          cp "$RUNNER_TEMP/engine/atlas-engine-macos" "$APP/Contents/MacOS/atlas-engine"
          cp "$RUNNER_TEMP/engine/atlas-engine-lib-macos.dylib" "$APP/Contents/MacOS/libatlas_engine.dylib"
          chmod +x "$APP/Contents/MacOS/atlas-updater" "$APP/Contents/MacOS/atlas-engine"
          # The licence texts and notices, as the packages must carry them.
          mkdir -p "$APP/Contents/Resources/licenses"
          cp LICENSE NOTICE.md "$APP/Contents/Resources/licenses/"
          cp -r LICENSES "$APP/Contents/Resources/licenses/"
          # The icon: the 128 px logo, resized to each size an app icon needs.
          ICONSET="$RUNNER_TEMP/AppIcon.iconset"
          mkdir -p "$ICONSET"
          make_icon() { sips -z "$1" "$1" icons/icon-128.png --out "$ICONSET/$2" >/dev/null; }
          make_icon 16 icon_16x16.png
          make_icon 32 icon_16x16@2x.png
          make_icon 32 icon_32x32.png
          make_icon 64 icon_32x32@2x.png
          make_icon 128 icon_128x128.png
          make_icon 256 icon_128x128@2x.png
          make_icon 256 icon_256x256.png
          make_icon 512 icon_256x256@2x.png
          make_icon 512 icon_512x512.png
          make_icon 1024 icon_512x512@2x.png
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Atlas Helper</string>
            <key>CFBundleDisplayName</key><string>Atlas Helper</string>
            <key>CFBundleExecutable</key><string>atlas-updater</string>
            <key>CFBundleIdentifier</key><string>org.atlas-translation.helper</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # Ad-hoc signature (no Apple certificate). Gatekeeper still asks the user to confirm the first time.
          codesign --force --deep --sign - "$APP"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Atlas Helper" -srcfolder "$STAGE" -ov -format UDZO "$RUNNER_TEMP/helper/${{ matrix.asset }}"
          ls -l "$RUNNER_TEMP/helper/${{ matrix.asset }}"

      - name: Keep the program for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/helper/${{ matrix.asset }}
          if-no-files-found: error

      # The Windows installer includes the offline engine, so the helper never downloads a program to run on Windows.
      - name: Download the Windows engine files (Windows only)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          pattern: atlas-engine-*windows*
          merge-multiple: true
          path: ${{ runner.temp }}/engine

      # The Windows installer (Inno Setup, for the current user only). Same script and checks as updater.yml.
      - name: Windows installer (Inno Setup, for the current user only)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: tools/atlas-updater
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup was not installed" }
          $line = Select-String -Path Cargo.toml -Pattern '^version = "([0-9.]+)\+([0-9]+)"' | Select-Object -First 1
          $version = "$($line.Matches[0].Groups[1].Value).$($line.Matches[0].Groups[2].Value)"
          $engineExe = Join-Path $env:RUNNER_TEMP "engine\atlas-engine-windows.exe"
          $engineLib = Join-Path $env:RUNNER_TEMP "engine\atlas-engine-lib-windows.dll"
          if (-not (Test-Path $engineExe) -or -not (Test-Path $engineLib)) { throw "the offline engine files are missing from the build" }
          & $iscc "/DMyAppVersion=$version" "/DEngineExe=$engineExe" "/DEngineLib=$engineLib" installer\atlas-helper.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }
          Copy-Item "dist\atlas-updater-windows-setup.exe" "$env:RUNNER_TEMP\helper\atlas-updater-windows-setup.exe"

      - name: Keep the installer for the publish job
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-updater-windows-setup
          path: ${{ runner.temp }}/helper/atlas-updater-windows-setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, chromium, firefox, helper, engine]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'true' && needs.chromium.result == 'success' && needs.firefox.result != 'cancelled' && needs.helper.result == 'success' && needs.engine.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download the Chromium package
        uses: actions/download-artifact@v4
        with:
          name: atlas-translation-chromium
          path: dist

      - name: Download the Firefox package
        uses: actions/download-artifact@v4
        with:
          name: atlas-translation-firefox
          path: dist

      - name: Download the helper programs
        uses: actions/download-artifact@v4
        with:
          pattern: atlas-updater-*
          merge-multiple: true
          path: dist

      - name: Write the Firefox update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # The GitHub build is signed by firefox.yml (unlisted) when submit_amo is on. The signed file is in dist/.
          SIGNED="dist/atlas-translation-$VERSION-firefox-signed.xpi"
          if [ ! -f "$SIGNED" ]; then
            # The update URL always points at the latest release, so keep a valid updates.json there.
            # Copy the previous release's file. It still describes the last signed version, so nothing new is offered.
            if gh release download --repo "$REPOSITORY" --pattern updates.json --dir dist --clobber 2>/dev/null; then
              echo "No signed Firefox add-on in this release. Kept the updates.json of the previous release, so self-hosted installs see no new version." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "No signed Firefox add-on and no previous updates.json. Self-hosted Firefox updates have no manifest until a signed release. Run the release with submit_amo on." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          node scripts/make-updates-json.mjs --version "$VERSION" --xpi "$SIGNED" --repo "$REPOSITORY" --out dist/updates.json

      - name: Name the Edge package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Edge uses the same MV3 package as Chromium. Attach it under its own name too.
          cp "dist/atlas-translation-$VERSION-chromium.zip" "dist/atlas-translation-$VERSION-edge.zip"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SUBMIT: ${{ needs.prepare.outputs.submit }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          TAG="v$VERSION"
          awk -v v="$VERSION" 'BEGIN { p = 0 } /^## / { if (p) exit; if ($2 == v) p = 1; next } p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $VERSION. Add a '## $VERSION' section and run again to get full notes." >&2
            echo "Atlas Translation $VERSION" > notes.md
          fi
          {
            echo ""
            if [ "$PRERELEASE" = "true" ]; then
              echo "> **Prerelease.** Not the public launch yet. The helper (atlas-updater) installs it while it includes prereleases."
              echo ""
            fi
          } >> notes.md
          # The download table, the files with their SHA-256, and the Stores and Helper notes. The checksums of every
          # file are written to dist/SHA256SUMS.txt here, so the upload below attaches that file too.
          node scripts/release-downloads.mjs --dist dist --version "$VERSION" --repo "$GITHUB_REPOSITORY" --store-submitted "$SUBMIT" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "Atlas Translation $VERSION" --notes-file notes.md --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" dist/* --title "Atlas Translation $VERSION" --notes-file notes.md --prerelease="$PRERELEASE"
          fi

      - name: Write job summary
        if: always()
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "## Published: Atlas Translation $VERSION"
            echo ""
            echo "- Release: https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
            echo "- Firefox GitHub build: attached to the release. Store submission: see the Firefox (store) job summary."
          } >> "$GITHUB_STEP_SUMMARY"
