<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF</title>
  <link rel="stylesheet" href="/lib/ui.css" />
  <script src="/lib/theme.js"></script>
  <style>
    body { width: 340px; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f3f5f9; color: #202124; font-size: 14px; }
    html.dark body, body.dark { background: #171a21; color: #f1f3f6; }
    .wrap { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    h1 { font-size: 16px; margin: 0; }
    .question { margin: 0; line-height: 1.45; }
    .muted { color: #5f6368; font-size: 12px; line-height: 1.4; margin: 0; }
    html.dark .muted { color: #a8b0bd; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5f6368; }
    html.dark label { color: #a8b0bd; }
    select { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid #d3d9e3; background: #fff; color: #202124; }
    html.dark select { background: #20242d; color: #f1f3f6; border-color: #3a404c; }
    button.primary { border: 0; background: #1f63d6; color: #fff; padding: 10px 14px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
    button.primary:disabled { opacity: 0.5; cursor: default; }
    a { color: #1f63d6; font-size: 13px; }
    html.dark a { color: #8ab4f8; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="title">PDF detected</h1>
    <p id="question" class="question"></p>
    <label>From
      <select id="from" aria-label="Document language"></select>
    </label>
    <label>To
      <select id="to" aria-label="Translate to"></select>
    </label>
    <button type="button" id="translate" class="primary"></button>
    <p id="note" class="muted"></p>
    <a href="popup-translate-document.html" id="online">Use an online service instead</a>
  </div>
  <script src="/lib/polyfill.js"></script>
  <script src="/lib/checkedLastError.js"></script>
  <script src="/lib/stuff.js"></script>
  <script src="/lib/languages.js"></script>
  <script src="/lib/config.js"></script>
  <script src="/lib/i18n.js"></script>
  <script src="popup-pdf-prompt.js"></script>
</body>
</html>
