# Licences that the Atlas Helper's Rust crates may use (checked by .github/workflows/licences.yml with cargo-deny).
# Any other licence fails the check, so a new dependency with an unlisted licence is reviewed before it ships.
# The texts of the common ones are in LICENSES/ at the repository root.

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # webpki-roots: the Mozilla root certificates used for HTTPS (a permissive data licence).
    "CDLA-Permissive-2.0",
]
