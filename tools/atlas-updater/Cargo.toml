[package]
name = "atlas-updater"
version = "0.0.2+7"
edition = "2021"
description = "Atlas Translation helper: a native window and tray icon that installs the extension, the offline engine and the language packs."
license = "MPL-2.0"
publish = false

# The helper is a native app (see src/gui.rs). eframe draws the window with OpenGL (glow), so wgpu is left out: it
# would add a large GPU stack the helper does not need. Wayland and X11 are both enabled for Linux.
[dependencies]
libloading = "0.8"

# Downloads and GitHub requests are made by the helper itself (rustls), not by curl.
ureq = "2"
# Unzips the downloads itself, on every system, not with PowerShell or unzip.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Unpacks the read-aloud voice archives (.tar.bz2) itself, the same way.
bzip2 = "0.5"
tar = "0.4"
# Reads the text of a page picture (PNG or JPEG) for offline OCR. Pure Rust, no native library.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Runs the PP-OCRv4 text models (ONNX) in pure Rust. The helper needs no native inference library.
tract-onnx = "0.21"
# The second text recognition engine (ocrs, MIT or Apache-2.0), in pure Rust. Its models are the .rten files, so the
# rten_format feature is on and the ONNX format is left out. rten is named directly because the engine takes its models.
ocrs = { version = "0.14", default-features = false, features = ["rten"] }
rten = { version = "0.28", default-features = false }
# The page picture arrives from the extension as base64.
base64 = "0.22"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "wayland", "x11"] }

# The system language, so the window can mirror its layout for right-to-left languages (Arabic, Hebrew, Persian ...).
sys-locale = "0.3"

# The tray icon. On Linux the ksni backend is used: it talks to the desktop over D-Bus and needs no GTK library.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.27", default-features = false, features = ["ksni"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.27"

[profile.release]
strip = true

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# Writes the Windows version information (company, product, description, version) into the program. Antivirus
# heuristics look at it: a program with no version information looks more unknown. This is not a signature.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
